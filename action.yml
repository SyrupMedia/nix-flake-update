name: "Nix"
author: "MolassesLover"
description: "Updates a Nix Flake at the repository's root, validates it and its output, then pushes it upstream if functional."
inputs:
  derivation:
    description: 'Target output attribute for derivation.'
    required: true
    default: '.'
runs:
  using: "composite"
  steps:
    - uses: actions/checkout@v6
    - uses: cachix/install-nix-action@v31
      with:
        nix_path: nixpkgs=channel:nixos-unstable
    - name: Update Flake
      run: |
        nix flake update
    - name: Updated build
      run: |
        nix flake check
        nix build "$OUT_ATTRIBUTE_DERIVATION"
      env:
        OUT_ATTRIBUTE_DERIVATION: ${{ inputs.derivation }}
    - name: Commit files
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        test -z "$(git status --porcelain)" || git commit -a -m "Updated `flake.lock`"
    - name: Push changes
      uses: ad-m/github-push-action@master
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        branch: ${{ github.ref }}
